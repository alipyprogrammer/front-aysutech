<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#e3fbf9"/></linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f5f55"/><stop offset="1" stop-color="#083c36"/></linearGradient>
    <linearGradient id="sim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d77a"/><stop offset="1" stop-color="#c9a13a"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a44"/><stop offset="1" stop-color="#07162c"/></linearGradient>
    <linearGradient id="tg" x1="14" y1="14" x2="256" y2="92" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#37b6f0"/><stop offset="1" stop-color="#155eef"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#07162c" flood-opacity=".22"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#155eef" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- ماژول -->
  <g transform="translate(110 250) rotate(-6 230 200)" filter="url(#sh)">

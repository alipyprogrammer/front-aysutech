    <rect x="10" y="10" width="440" height="360" rx="20" fill="none" stroke="#2fb89f" stroke-opacity=".35" stroke-width="2"/>
    <g stroke="#3fd3b6" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M190 120H250V70H330"/><path d="M190 175H280V230H400"/><path d="M120 260V320H300"/><path d="M330 120V180"/>
    </g>
    <g fill="#d9b44a"><circle cx="330" cy="70" r="7"/><circle cx="400" cy="230" r="7"/><circle cx="300" cy="320" r="7"/></g>
    <g fill="#e8c35a">
      <circle cx="40" cy="40" r="11"/><circle cx="420" cy="40" r="11"/><circle cx="40" cy="340" r="11"/><circle cx="420" cy="340" r="11"/>
    </g>
    <g fill="#0b2521"><circle cx="40" cy="40" r="5"/><circle cx="420" cy="40" r="5"/><circle cx="40" cy="340" r="5"/><circle cx="420" cy="340" r="5"/></g>
    <!-- هدرپین -->
    <g><rect x="360" y="270" width="70" height="80" rx="6" fill="#111"/>
      <g fill="#e6c25b"><rect x="372" y="282" width="10" height="10"/><rect x="392" y="282" width="10" height="10"/><rect x="412" y="282" width="10" height="10"/><rect x="372" y="304" width="10" height="10"/><rect x="392" y="304" width="10" height="10"/><rect x="412" y="304" width="10" height="10"/><rect x="372" y="326" width="10" height="10"/><rect x="392" y="326" width="10" height="10"/><rect x="412" y="326" width="10" height="10"/></g></g>
    <!-- چیپ GSM -->
    <rect x="60" y="80" width="140" height="130" rx="10" fill="#15191f"/>
    <rect x="72" y="92" width="116" height="106" rx="6" fill="#20262e"/>
    <text x="130" y="138" fill="#9fb3c8" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial">GSM</text>
    <text x="130" y="168" fill="#6c8096" font-size="15" text-anchor="middle" font-family="Arial">SMS · 4G</text>
    <!-- اسلات سیم‌کارت -->
    <rect x="215" y="245" width="130" height="95" rx="10" fill="#c7ccd4"/>
    <path d="M225 255H320L335 270V330H225Z" fill="url(#sim)"/>
    <g stroke="#9a7a24" stroke-width="2" fill="none"><rect x="245" y="275" width="60" height="42" rx="6"/><path d="M275 275V317M245 296H305"/></g>
    <!-- LED -->
    <circle cx="400" cy="120" r="10" fill="#27e27a"/><circle cx="400" cy="120" r="22" fill="#27e27a" opacity=".2"/>
    <!-- آنتن -->
    <rect x="440" y="-30" width="24" height="60" rx="6" fill="#c9ced6"/>
    <path d="M452 -30V-150" stroke="#2b3647" stroke-width="10" stroke-linecap="round"/>
    <g fill="none" stroke="#2b3647" stroke-width="4"><path d="M442 -60h20M442 -80h20M442 -100h20M442 -120h20"/></g>
  </g>

  <!-- مسیر پیامک -->
  <g fill="none" stroke="#155eef" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" opacity=".55">
    <path d="M590 430C680 360 760 360 830 410"/>
  </g>
  <g transform="translate(575 225)" filter="url(#sh)">
    <rect width="230" height="92" rx="22" fill="#fff"/>
    <path d="M40 92L30 118L66 92Z" fill="#fff"/>

    <text x="205" y="70" font-size="15" fill="#637083" text-anchor="end">کد تأیید: ۴۸۲۹۱۷</text>
    <circle cx="36" cy="46" r="18" fill="#eaf1ff"/><path d="M27 40h18v12H27z M27 40l9 7 9-7" fill="none" stroke="#155eef" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <!-- گوشی و پیام‌رسان -->
  <g transform="translate(830 190)" filter="url(#sh)">
    <rect width="270" height="520" rx="42" fill="url(#phone)"/>
    <rect x="14" y="14" width="242" height="492" rx="32" fill="#f4f8fc"/>
    <rect x="14" y="14" width="242" height="78" rx="32" fill="url(#tg)"/><rect x="14" y="60" width="242" height="32" fill="url(#tg)"/>
    <circle cx="214" cy="54" r="20" fill="#fff" fill-opacity=".25"/>
    <path d="M205 55l20-9-5 20-5-6z" fill="#fff"/>
    <text x="184" y="50" font-size="16" font-weight="700" fill="#fff" text-anchor="end">ربات پیامک</text>
    <text x="184" y="72" font-size="12" fill="#dbeaff" text-anchor="end">آنلاین</text>
    <g font-size="13" text-anchor="end">
      <rect x="40" y="120" width="200" height="96" rx="16" fill="#fff" stroke="#dce4ef"/>
      <text x="226" y="146" fill="#155eef" font-weight="700">📩 از: 9830001234</text>
      <text x="226" y="172" fill="#07162c">کد تأیید: ۴۸۲۹۱۷</text>
      <text x="226" y="200" fill="#8c98aa" font-size="11">ساعت ۱۰:۴۲</text>
      <rect x="40" y="232" width="200" height="96" rx="16" fill="#fff" stroke="#dce4ef"/>
      <text x="226" y="258" fill="#155eef" font-weight="700">📩 از: بانک</text>
      <text x="226" y="284" fill="#07162c">واریز به حساب شما</text>
      <text x="226" y="312" fill="#8c98aa" font-size="11">ساعت ۱۰:۴۵</text>
      <rect x="40" y="344" width="200" height="72" rx="16" fill="#e3fbf9" stroke="#bdeee9"/>
      <text x="226" y="372" fill="#07714f" font-weight="700">✅ دستگاه آنلاین است</text>
      <text x="226" y="398" fill="#4a7d70" font-size="11">کیفیت آنتن: عالی</text>
    </g>
    <rect x="100" y="480" width="70" height="6" rx="3" fill="#c3ccd8"/>
  </g>

  <text x="1140" y="840" fill="#07162c" fill-opacity=".45" font-size="18" font-weight="700" text-anchor="end" font-family="Arial">AYSUTECH · SMS → TELEGRAM</text>
</svg>
